/* ─── ICON ───────────────────────────────────────────────── */
function Icon({name, size=16, color=C.accent, sw=1.4, style={}}){
  const ref = React.useRef(null);
  React.useEffect(()=>{
    if(!ref.current) return;
    const kebab = name.replace(/([A-Z])/g, m=>'-'+m.toLowerCase()).replace(/^-/,'');
    ref.current.innerHTML = `<i data-lucide="${kebab}"></i>`;
    try{
      lucide.createIcons({
        nameAttr:'data-lucide',
        attrs:{width:size,height:size,stroke:color,'stroke-width':String(sw),'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'},
        icons:{[name]:lucide[name]},
      });
    }catch(e){}
  },[name,size,color,sw]);
  return React.createElement('span',{ref,style:{display:'inline-flex',alignItems:'center',flexShrink:0,...style}});
}

  {cat:'Bangkok · Nacht',         title:'Bangkok schläft nie.',             sub:'Um 3 Uhr morgens.',        body:'Um drei Uhr morgens bekommt man problemlos Pad Thai, Cocktails, einen Haarschnitt und eine Massage - oft alles innerhalb weniger Straßenzüge.',                                                                                                                                                                                                              meta:'Citywide',     icon:'Moon'},
  {cat:'Basics · Nacht',          title:'Chao Phraya bei Nacht.',           sub:'Auf dem Wasser.',          body:'Tempel und Skyline beleuchtet - völlig anderes Gefühl als tagsüber. Öffentliche Fähre ab Tha Chang Pier abends: günstig, atmosphärisch, unvergesslich.',                                                                                                                                                                                                    meta:'Citywide',    icon:'Moon'},
