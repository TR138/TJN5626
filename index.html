<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hochzeitsreise</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;font-size:16px}
body{
 background:#F4F1EC;
 min-height:100vh;
 font-family:'Inter',system-ui,sans-serif;
 font-weight:300;
 color:#2D2D2D;
 overflow-x:hidden;
}
#root{min-height:100vh}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const C = {
 bg:"#F4F1EC",
 surface:"#FFFFFF",
 surfaceHi:"#E8F0EA",
 accent:"#4A7C59",
 accentMid:"rgba(74,124,89,0.40)",
 text:"#2A2A2A",
 textMid:"rgba(42,42,42,0.60)",
 border:"rgba(42,42,42,0.08)",
 borderAcc:"rgba(74,124,89,0.30)",
};

const F="'Inter',system-ui,sans-serif";
const FD="'Cormorant Garamond',Georgia,serif";

function GiftPage(){
 const e = React.createElement;
 const px = 'clamp(24px,7vw,80px)';

 const section=(children)=>
   e('section',{style:{padding:`clamp(80px,10vh,120px) ${px}`,background:C.bg}},...children);

 const S1 = section([
  e('div',{style:{maxWidth:640,margin:'0 auto',textAlign:'center'}},

   e('h1',{style:{
    fontFamily:FD,
    fontSize:'clamp(40px,7vw,68px)',
    fontWeight:300,
    lineHeight:.96,
   }},'Das Abenteuer'),

   e('h1',{style:{
    fontFamily:FD,
    fontSize:'clamp(40px,7vw,68px)',
    fontWeight:300,
    fontStyle:'italic',
    lineHeight:.96,
    color:C.accent,
    marginBottom:28
   }},'beginnt.'),

   e('p',{style:{
    fontFamily:FD,
    fontSize:26,
    fontStyle:'italic',
    color:C.textMid,
    marginBottom:28
   }},'Liebe Theresa, lieber Jonas,'),

   e('p',{style:{
    fontFamily:F,
    fontSize:15,
    lineHeight:1.9,
    color:C.textMid,
    marginBottom:20
   }},
   'für eure Hochzeit wünschen wir euch vor allem gemeinsame Erinnerungen. Deshalb möchten wir einen kleinen Teil eurer Hochzeitsreise begleiten.'
   ),

   e('p',{style:{
    fontFamily:F,
    fontSize:15,
    lineHeight:1.9,
    color:C.textMid,
    marginBottom:20
   }},
   'Ob Thailand, Mallorca oder ganz woanders: Gönnt euch unterwegs einen besonderen Abend, eine außergewöhnliche Unterkunft oder einen Moment, an den ihr euch noch Jahre später erinnert.'
   )
  )
 ]);

 const S4 = section([
  e('div',{style:{maxWidth:560,margin:'0 auto',textAlign:'center'}},

   e('div',{style:{
    background:C.surface,
    borderRadius:20,
    border:`1px solid ${C.borderAcc}`,
    padding:'40px'
   }},

   e('p',{style:{
    fontFamily:FD,
    fontSize:'clamp(44px,8vw,72px)',
    color:C.accent,
    marginBottom:20
   }},'XXX €'),

   e('p',{style:{
    fontFamily:F,
    fontSize:14,
    lineHeight:1.8,
    color:C.textMid
   }},
   'Dieser Beitrag soll euch die Freiheit geben, eure Reise ganz nach euren Wünschen zu gestalten.'
   )
   )
  )
 ]);

 const S5 = section([
  e('div',{style:{maxWidth:560,margin:'0 auto',textAlign:'center'}},

   e('p',{style:{
    fontFamily:F,
    fontSize:15,
    lineHeight:1.9,
    color:C.textMid,
    marginBottom:40
   }},
   'Wir freuen uns auf die Geschichten, die ihr mit nach Hause bringt.'
   ),

   e('p',{style:{
    fontFamily:FD,
    fontSize:26,
    fontStyle:'italic',
    color:C.textMid
   }},
   'Mit Liebe,',
   e('br'),
   'Christina & Pascal'
   )
  )
 ]);

 return e('div',null,S1,S4,S5);
}

function App(){
 return React.createElement(GiftPage);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

</script>
</body>
</html>
